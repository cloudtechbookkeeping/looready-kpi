name: LooReady Hourly KPI Update
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-kpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Pull KPI data
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
        run: python sp_api_pull.py
      - run: python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/status.json docs/kpi_history.json kpi_data/
          git diff --cached --quiet || git commit -m "Dashboard: $(date -u '+%B %-d %Y %H:%M UTC')"
          git push
      - name: Patch velocities and deploy to Hostinger
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          cp docs/index.html /tmp/live.html
          sed -i "s|targetVelocity:'26.0/d'|targetVelocity:'35/d'|g" /tmp/live.html
          sed -i "s|targetVelocity:'~4.8/d'|targetVelocity:'5/d'|g" /tmp/live.html
          grep -o "targetVelocity:'[^']*'" /tmp/live.html
          python3 -c "import ftplib,io,os; d=open('/tmp/live.html','rb').read(); f=ftplib.FTP(); f.connect('145.79.209.123',21,timeout=30); f.login('u133013644',os.environ['FTP_PASS']); f.storbinary('STOR /public_html/looreadykpi/index.html',io.BytesIO(d)); f.quit(); print('done',len(d))" "u133013644:${FTP_PASS}" "ftp://145.79.209.123/public_html/looreadykpi/index.html"
          echo "Done"
