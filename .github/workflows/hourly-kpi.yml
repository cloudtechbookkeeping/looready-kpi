name: LooReady Hourly KPI Update

on:
  schedule:
    - cron: '0 * * * *'   # Every hour, every day
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

permissions:
  contents: write           # Needed to commit docs/index.html back to repo

jobs:
  update-kpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull Amazon KPI data
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
        run: python sp_api_pull.py

      - name: Build dashboard HTML
        run: python build_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/status.json docs/kpi_history.json kpi_data/
          git diff --cached --quiet || git commit -m "Dashboard: $(date -u '+%B %-d %Y %H:%M UTC')"
          git push

      - name: Patch and deploy looready-kpi-fixed.html to Hostinger
        env:
          FTP_HOST: "145.79.209.123"
          FTP_USER: "u133013644"
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, io, urllib.request, os, re

          # Fetch live HTML from Hostinger
          req = urllib.request.Request(
            'http://looreadykpi.cloudtechbookkeeping.com/',
            headers={'User-Agent': 'Mozilla/5.0'}
          )
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')

          # Patch target velocities
          html = re.sub(r"targetVelocity:'[^']*'", lambda m: {
            "targetVelocity:'26.0/d'": "targetVelocity:'35/d'",
            "targetVelocity:'~4.8/d'": "targetVelocity:'5/d'",
          }.get(m.group(0), m.group(0)), html)

          # Patch per explicit values
          html = html.replace("targetVelocity:'26.0/d'", "targetVelocity:'35/d'")
          html = html.replace("targetVelocity:'~4.8/d'", "targetVelocity:'5/d'")

          # FTP upload
          ftp = ftplib.FTP()
          ftp.connect(os.environ['FTP_HOST'], 21, timeout=30)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftp.cwd('/public_html/looreadykpi')
          ftp.storbinary('STOR index.html', io.BytesIO(html.encode('utf-8')))
          ftp.quit()
          print('Deployed', len(html), 'chars to Hostinger')

          # Verify velocities in deployed content
          import re as _re
          vels = _re.findall(r"targetVelocity:'([^']+)'", html)
          print('Velocities:', vels)
          PYEOF
