name: LooReady Hourly KPI Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-kpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests paramiko

      - name: Pull Amazon KPI data
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
        run: python sp_api_pull.py

      - name: Update dashboard and upload to Hostinger
        env:
          FTP_HOST: 145.79.209.123
          FTP_USER: u133013644
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python build_dashboard.py
