name: Fix Donut Legend
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix donut legend overlap
        run: |
          sed -i 's/display: true, position:/display: false, position:/g' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Fix: hide Chart.js legend on profit donut to stop overlap"
          git push
