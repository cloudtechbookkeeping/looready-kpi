name: Fix Donut Legend
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix donut legend in template and output
        run: |
          sed -i "s|cutout: '70%', plugins: { legend: { display: true|cutout: '70%', plugins: { legend: { display: false|g" looready-kpi.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add looready-kpi.html docs/index.html
          git diff --staged --quiet || git commit -m "Fix: hide donut legend in template + output"
          git push
