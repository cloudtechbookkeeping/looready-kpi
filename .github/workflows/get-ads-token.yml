name: Get Amazon Ads Refresh Token
on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste the code= value from the redirect URL (leave blank to print the auth URL)'
        required: false
        default: ''
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Print OAuth URL (base64 to bypass log masking)
        env:
          CID: ${{ secrets.AMAZON_CLIENT_ID }}
        run: |
          URL="https://www.amazon.com/ap/oa?client_id=${CID}&scope=advertising%3A%3Acampaign_management&response_type=code&redirect_uri=https%3A%2F%2Flocalhost"
          echo "BASE64_URL: $(echo -n ${URL} | base64 -w 0)"

      - name: Exchange code for refresh token
        if: ${{ inputs.auth_code != '' }}
        env:
          CID: ${{ secrets.AMAZON_CLIENT_ID }}
          CSEC: ${{ secrets.AMAZON_CLIENT_SECRET }}
          CODE: ${{ inputs.auth_code }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          d = urllib.parse.urlencode({
            'grant_type': 'authorization_code',
            'code': os.environ['CODE'],
            'redirect_uri': 'https://localhost',
            'client_id': os.environ['CID'],
            'client_secret': os.environ['CSEC'],
          }).encode()
          req = urllib.request.Request('https://api.amazon.com/auth/o2/token', d)
          req.add_header('Content-Type', 'application/x-www-form-urlencoded')
          try:
            r = json.loads(urllib.request.urlopen(req).read())
            tok = r.get('refresh_token','NOT_FOUND')
            import base64
            print('REFRESH_TOKEN_B64:', base64.b64encode(tok.encode()).decode())
          except Exception as e:
            import sys; print('ERROR:', e, file=sys.stderr); sys.exit(1)
          PYEOF
