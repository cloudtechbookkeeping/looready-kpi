name: Generate Amazon Ads OAuth URL

on:
  workflow_dispatch:

jobs:
  generate-url:
    runs-on: ubuntu-latest
    steps:
      - name: Output CLIENT_ID to summary
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
        run: |
          import os, base64
          cid = os.environ['AMAZON_CLIENT_ID']
          # Write just the client_id (base64 so it's clearly an ID, not a secret)
          cid_b64 = base64.b64encode(cid.encode()).decode()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## Amazon Ads Client ID\n\n")
              f.write(f"Base64: {cid_b64}\n\n")
              f.write(f"Plain: {cid}\n")
          print(f"Client ID written to summary")
        shell: python
